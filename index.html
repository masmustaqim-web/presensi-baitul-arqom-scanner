<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Scanner Presensi Baitul Arqom
  </title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ==================================================
       HTML5 QR CODE
       ================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    :root {

      --navy: #071d3a;
      --navy-2: #0b315e;

      --green: #0b8f5b;
      --green-2: #13b875;

      --white: #ffffff;
      --muted: #aabbd0;

      --danger: #ef4444;
      --warning: #f59e0b;

      --radius: 22px;

      --shadow:
        0 20px 60px
        rgba(0,0,0,.35);
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      min-height: 100%;

      margin: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        'Poppins',
        sans-serif;

      color:
        var(--white);

      background:

        radial-gradient(
          circle at 15% 10%,
          rgba(19,184,117,.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 90% 20%,
          rgba(11,49,94,.65),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          var(--navy),
          #06152b 60%,
          #041126
        );

      padding:
        18px;
    }


    .app {

      width:
        min(600px, 100%);

      margin:
        0 auto;
    }


    /* ==================================================
       HEADER
       ================================================== */

    .header {

      text-align: center;

      padding:
        8px 0 18px;
    }


    .logo {

      width: 58px;

      height: 58px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 8px 18px
          rgba(0,0,0,.35)
        );
    }


    .header h1 {

      margin:
        8px 0 3px;

      font-size: 21px;

      font-weight: 800;
    }


    .header p {

      margin: 0;

      color:
        var(--muted);

      font-size: 11px;
    }


    /* ==================================================
       CARD
       ================================================== */

    .card {

      padding:
        16px;

      border-radius:
        var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.085),
          rgba(255,255,255,.035)
        );

      border:
        1px solid
        rgba(255,255,255,.10);

      box-shadow:
        var(--shadow);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);
    }


    /* ==================================================
       SESSION
       ================================================== */

    .session {

      padding:
        11px 13px;

      margin-bottom:
        13px;

      border-radius:
        13px;

      background:
        rgba(0,0,0,.18);

      border:
        1px solid
        rgba(255,255,255,.08);

      font-size: 12px;

      color:
        var(--muted);

      text-align: center;
    }


    .session strong {

      color:
        white;
    }


    /* ==================================================
       CAMERA
       ================================================== */

    .camera-wrap {

      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius:
        18px;

      background:
        #020812;

      border:
        1px solid
        rgba(255,255,255,.10);
    }


    #reader {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;
    }


    #reader video {

      width:
        100% !important;

      height:
        100% !important;

      object-fit:
        cover !important;
    }


    #reader img {

      display: none !important;
    }


    /* ==================================================
       QR FRAME
       ================================================== */

    .qr-frame {

      position: absolute;

      width:
        62%;

      aspect-ratio:
        1 / 1;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      border:
        3px solid
        var(--green-2);

      border-radius:
        22px;

      box-shadow:

        0 0 0 9999px
        rgba(0,0,0,.20),

        0 0 25px
        rgba(19,184,117,.40);

      pointer-events:
        none;

      z-index: 10;
    }


    .qr-corner {

      position: absolute;

      width: 30px;

      height: 30px;

      border-color:
        white;

      border-style: solid;
    }


    .corner-tl {

      left: -3px;
      top: -3px;

      border-width:
        4px 0 0 4px;
    }


    .corner-tr {

      right: -3px;
      top: -3px;

      border-width:
        4px 4px 0 0;
    }


    .corner-bl {

      left: -3px;
      bottom: -3px;

      border-width:
        0 0 4px 4px;
    }


    .corner-br {

      right: -3px;
      bottom: -3px;

      border-width:
        0 4px 4px 0;
    }


    /* ==================================================
       STATUS OVER CAMERA
       ================================================== */

    .camera-status {

      position: absolute;

      left: 12px;
      right: 12px;
      bottom: 12px;

      padding:
        10px 12px;

      border-radius:
        12px;

      background:
        rgba(2,8,18,.78);

      border:
        1px solid
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(10px);

      font-size: 11px;

      text-align: center;

      color:
        var(--muted);

      z-index: 20;
    }


    .camera-status.success {

      color:
        #8af0c3;
    }


    .camera-status.error {

      color:
        #ffaaaa;
    }


    /* ==================================================
       CAMERA SELECT
       ================================================== */

    .camera-controls {

      margin-top:
        13px;
    }


    .camera-label {

      display: block;

      margin-bottom: 6px;

      color:
        #d8e5f4;

      font-size: 11px;

      font-weight: 600;
    }


    select {

      width: 100%;

      height: 45px;

      padding:
        0 12px;

      border-radius:
        12px;

      border:
        1px solid
        rgba(255,255,255,.12);

      background:
        rgba(3,17,36,.80);

      color:
        white;

      font-family:
        inherit;

      font-size: 12px;

      outline: none;
    }


    /* ==================================================
       BUTTONS
       ================================================== */

    .buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-top:
        13px;
    }


    button {

      min-height:
        45px;

      border:
        0;

      border-radius:
        12px;

      padding:
        9px 13px;

      font-family:
        inherit;

      font-size:
        12px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        .2s ease;
    }


    button:hover {

      transform:
        translateY(-1px);
    }


    .primary {

      color:
        white;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-2)
        );
    }


    .secondary {

      color:
        white;

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.12);
    }


    /* ==================================================
       RESULT
       ================================================== */

    .result {

      margin-top:
        13px;

      min-height:
        48px;

      padding:
        11px 13px;

      border-radius:
        13px;

      background:
        rgba(0,0,0,.18);

      border:
        1px solid
        rgba(255,255,255,.07);

      text-align:
        center;

      font-size:
        12px;

      color:
        var(--muted);
    }


    .result.success {

      color:
        #8af0c3;

      background:
        rgba(11,143,91,.13);
    }


    .result.error {

      color:
        #ffaaaa;

      background:
        rgba(239,68,68,.10);
    }


    /* ==================================================
       FOOTER
       ================================================== */

    .footer {

      text-align:
        center;

      color:
        rgba(255,255,255,.38);

      font-size:
        10px;

      margin-top:
        14px;
    }


    /* ==================================================
       MOBILE
       ================================================== */

    @media(max-width:500px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 11px;
        border-radius: 18px;
      }

      .camera-wrap {
        border-radius: 15px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <main class="app">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

      <img
        class="logo"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Muhammadiyah.svg/512px-Muhammadiyah.svg.png"
        alt="Muhammadiyah"
        onerror="this.style.display='none'"
      >

      <h1>
        Scanner Presensi
      </h1>

      <p>
        Baitul Arqom • QR Attendance
      </p>

    </header>


    <!-- =================================================
         CARD
         ================================================= -->

    <section class="card">


      <div
        id="sessionBox"
        class="session"
      >
        Sesi:
        <strong id="sessionName">
          Memuat...
        </strong>
      </div>


      <!-- CAMERA -->

      <div class="camera-wrap">


        <div id="reader"></div>


        <div class="qr-frame">

          <div
            class="qr-corner corner-tl">
          </div>

          <div
            class="qr-corner corner-tr">
          </div>

          <div
            class="qr-corner corner-bl">
          </div>

          <div
            class="qr-corner corner-br">
          </div>

        </div>


        <div
          id="cameraStatus"
          class="camera-status"
        >
          Menyiapkan kamera...
        </div>


      </div>


      <!-- CAMERA SELECT -->

      <div class="camera-controls">

        <label
          class="camera-label"
          for="cameraSelect"
        >
          Pilih Kamera
        </label>


        <select
          id="cameraSelect"
          disabled
        >

          <option value="">
            Mencari kamera...
          </option>

        </select>

      </div>


      <!-- BUTTONS -->

      <div class="buttons">

        <button
          id="btnCamera"
          class="primary"
          onclick="activateCamera()"
        >
          📷 Aktifkan Kamera
        </button>


        <button
          class="secondary"
          onclick="closeScanner()"
        >
          ✕ Tutup Scanner
        </button>

      </div>


      <!-- RESULT -->

      <div
        id="result"
        class="result"
      >
        Arahkan kamera ke QR peserta.
      </div>


    </section>


    <div class="footer">
      RS PKU Muhammadiyah Wonosobo
    </div>


  </main>


  <script>


    // ====================================================
    // URL PARAMETER
    // ====================================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    let SESSION_CODE =
      params.get('sesi') || '';


    const NONCE =
      params.get('nonce') || '';


    const TARGET_ORIGIN =
      params.get('targetOrigin') || '';


    // ====================================================
    // STATE
    // ====================================================

    let html5QrCode = null;

    let cameras = [];

    let selectedCameraId = null;

    let scannerRunning = false;

    let scannerPaused = false;

    let processingScan = false;

    let lastScannedText = '';

    let lastScanTime = 0;


    // ====================================================
    // DOM
    // ====================================================

    const cameraSelect =
      document.getElementById(
        'cameraSelect'
      );


    const cameraStatus =
      document.getElementById(
        'cameraStatus'
      );


    const resultBox =
      document.getElementById(
        'result'
      );


    const sessionName =
      document.getElementById(
        'sessionName'
      );


    const btnCamera =
      document.getElementById(
        'btnCamera'
      );


    // ====================================================
    // INIT
    // ====================================================

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        sessionName.textContent =
          SESSION_CODE ||
          'Belum dipilih';


        window.addEventListener(
          'message',
          handleParentMessage
        );


        // -----------------------------------------------
        // Beritahu Apps Script bahwa scanner siap
        // -----------------------------------------------

        postToParent({

          type:
            'BA_SCANNER_READY',

          session:
            SESSION_CODE

        });


        // -----------------------------------------------
        // Coba mencari kamera
        // -----------------------------------------------

        requestCameras();

      }
    );


    // ====================================================
    // POST MESSAGE KE PARENT
    // ====================================================

    function postToParent(message) {

      if (
        !TARGET_ORIGIN ||
        TARGET_ORIGIN === 'null'
      ) {
        return;
      }


      window.opener?.postMessage(
        {
          ...message,
          nonce: NONCE
        },
        TARGET_ORIGIN
      );
    }


    // ====================================================
    // VALIDASI PESAN PARENT
    // ====================================================

    function handleParentMessage(event) {


      // --------------------------------------------------
      // Harus dari window opener
      // --------------------------------------------------

      if (
        window.opener &&
        event.source !== window.opener
      ) {
        return;
      }


      // --------------------------------------------------
      // Origin harus sama dengan target
      // --------------------------------------------------

      if (
        event.origin !== TARGET_ORIGIN
      ) {
        return;
      }


      const data =
        event.data || {};


      // --------------------------------------------------
      // Nonce
      // --------------------------------------------------

      if (
        data.nonce !== NONCE
      ) {
        return;
      }


      // ==================================================
      // START
      // ==================================================

      if (
        data.type ===
        'BA_START_SCANNER'
      ) {

        activateCamera();

        return;
      }


      // ==================================================
      // REQUEST CAMERA
      // ==================================================

      if (
        data.type ===
        'BA_REQUEST_CAMERAS'
      ) {

        requestCameras();

        return;
      }


      // ==================================================
      // SWITCH CAMERA
      // ==================================================

      if (
        data.type ===
        'BA_SWITCH_CAMERA'
      ) {

        if (data.cameraId) {

          selectedCameraId =
            data.cameraId;

          startScanner(
            selectedCameraId
          );
        }

        return;
      }


      // ==================================================
      // SET SESSION
      // ==================================================

      if (
        data.type ===
        'BA_SET_SESSION'
      ) {

        SESSION_CODE =
          String(
            data.session || ''
          ).trim();


        sessionName.textContent =
          SESSION_CODE ||
          'Belum dipilih';


        return;
      }


      // ==================================================
      // STOP
      // ==================================================

      if (
        data.type ===
        'BA_STOP_SCANNER'
      ) {

        stopScanner();

        return;
      }


      // ==================================================
      // PAUSE
      // ==================================================

      if (
        data.type ===
        'BA_PAUSE_SCANNER'
      ) {

        pauseScanner();

        return;
      }


      // ==================================================
      // RESUME
      // ==================================================

      if (
        data.type ===
        'BA_RESUME_SCANNER'
      ) {

        resumeScanner();

        return;
      }


      // ==================================================
      // RESULT DARI APPS SCRIPT
      // ==================================================

      if (
        data.type ===
        'BA_ATTENDANCE_RESULT'
      ) {

        handleAttendanceResult(
          data
        );

        return;
      }

    }


    // ====================================================
    // REQUEST CAMERA
    // ====================================================

    async function requestCameras() {

      setCameraStatus(
        'Meminta izin kamera...',
        ''
      );


      try {

        const devices =
          await Html5Qrcode.getCameras();


        cameras =
          devices || [];


        if (
          cameras.length === 0
        ) {

          throw new Error(
            'Tidak ada kamera yang ditemukan.'
          );
        }


        // ------------------------------------------------
        // Isi dropdown
        // ------------------------------------------------

        cameraSelect.innerHTML =
          '';


        cameras.forEach(
          function(camera, index) {

            const option =
              document.createElement(
                'option'
              );


            option.value =
              camera.id;


            option.textContent =
              camera.label ||
              (
                'Kamera ' +
                (index + 1)
              );


            cameraSelect.appendChild(
              option
            );

          }
        );


        cameraSelect.disabled =
          false;


        // ------------------------------------------------
        // Pilih kamera belakang
        // ------------------------------------------------

        const rearCamera =
          cameras.find(
            function(camera) {

              const label =
                String(
                  camera.label || ''
                ).toLowerCase();


              return (
                label.includes('back') ||
                label.includes('rear') ||
                label.includes('environment') ||
                label.includes('belakang')
              );
            }
          );


        selectedCameraId =
          rearCamera
            ? rearCamera.id
            : cameras[0].id;


        cameraSelect.value =
          selectedCameraId;


        // ------------------------------------------------
        // Kirim daftar ke Apps Script
        // ------------------------------------------------

        postToParent({

          type:
            'BA_CAMERA_LIST',

          cameras:
            cameras.map(
              function(camera, index) {

                return {

                  id:
                    camera.id,

                  label:
                    camera.label ||
                    (
                      'Kamera ' +
                      (index + 1)
                    )
                };

              }
            ),

          selected:
            selectedCameraId

        });


        setCameraStatus(
          'Kamera ditemukan. Siap digunakan.',
          ''
        );


        // ------------------------------------------------
        // Otomatis mulai
        // ------------------------------------------------

        await startScanner(
          selectedCameraId
        );


      } catch (error) {

        console.error(
          'Camera error:',
          error
        );


        setCameraStatus(
          'Kamera belum aktif. Klik "Aktifkan Kamera".',
          'error'
        );


        setResult(
          error.message ||
          'Akses kamera belum tersedia.',
          'error'
        );


        postToParent({

          type:
            'BA_SCANNER_STATUS',

          status:
            'error',

          message:
            error.message ||
            'Akses kamera belum tersedia.'

        });

      }

    }


    // ====================================================
    // ACTIVATE CAMERA
    // ====================================================

    async function activateCamera() {

      try {

        if (
          !cameras.length
        ) {

          await requestCameras();

          return;
        }


        await startScanner(
          selectedCameraId
        );

      } catch (error) {

        console.error(error);


        setCameraStatus(
          'Kamera gagal diaktifkan.',
          'error'
        );


        setResult(
          error.message ||
          'Gagal mengaktifkan kamera.',
          'error'
        );

      }

    }


    // ====================================================
    // START SCANNER
    // ====================================================

    async function startScanner(
      cameraId
    ) {

      if (
        scannerRunning
      ) {
        return;
      }


      if (!cameraId) {

        throw new Error(
          'Kamera belum dipilih.'
        );
      }


      // --------------------------------------------------
      // Buat instance baru
      // --------------------------------------------------

      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode(
            'reader',
            {
              verbose: false
            }
          );
      }


      setCameraStatus(
        'Mengaktifkan kamera...',
        ''
      );


      try {

        await html5QrCode.start(

          cameraId,

          {

            fps: 10,

            qrbox: function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * .62
                );


              return {
                width: size,
                height: size
              };

            },

            aspectRatio: 1.0,

            disableFlip: false

          },


          onScanSuccess,


          onScanFailure

        );


        scannerRunning =
          true;


        scannerPaused =
          false;


        processingScan =
          false;


        setCameraStatus(
          'Kamera aktif • Arahkan QR ke kotak hijau.',
          ''
        );


        setResult(
          'Menunggu QR peserta...',
          ''
        );


        btnCamera.textContent =
          '✓ Kamera Aktif';


        btnCamera.disabled =
          true;


        postToParent({

          type:
            'BA_SCANNER_STATUS',

          status:
            'ready',

          message:
            'Kamera aktif.'

        });


      } catch (error) {

        scannerRunning =
          false;


        console.error(
          'Start scanner error:',
          error
        );


        setCameraStatus(
          'Gagal mengaktifkan kamera.',
          'error'
        );


        setResult(
          error.message ||
          'Kamera gagal diaktifkan.',
          'error'
        );


        postToParent({

          type:
            'BA_SCANNER_STATUS',

          status:
            'error',

          message:
            error.message ||
            'Kamera gagal diaktifkan.'

        });

      }

    }


    // ====================================================
    // SCAN SUCCESS
    // ====================================================

    function onScanSuccess(
      decodedText
    ) {

      if (
        !scannerRunning ||
        scannerPaused ||
        processingScan
      ) {
        return;
      }


      const now =
        Date.now();


      const text =
        String(
          decodedText || ''
        ).trim();


      if (!text) {
        return;
      }


      // --------------------------------------------------
      // Debounce QR yang sama
      // --------------------------------------------------

      if (
        text === lastScannedText &&
        now - lastScanTime < 3000
      ) {
        return;
      }


      lastScannedText =
        text;


      lastScanTime =
        now;


      processingScan =
        true;


      pauseScanner();


      setCameraStatus(
        'QR terbaca • Memproses...',
        ''
      );


      setResult(
        'QR: ' + text,
        ''
      );


      playSuccessSound();


      postToParent({

        type:
          'BA_QR_SCANNED',

        nomorId:
          text,

        kodeSesi:
          SESSION_CODE

      });

    }


    // ====================================================
    // SCAN FAILURE
    // ====================================================

    function onScanFailure(
      error
    ) {

      // Sengaja tidak menampilkan
      // error frame-by-frame.
      // html5-qrcode memang akan memanggil
      // callback ini terus selama QR belum ditemukan.

    }


    // ====================================================
    // ATTENDANCE RESULT
    // ====================================================

    function handleAttendanceResult(
      data
    ) {

      processingScan =
        false;


      if (
        data.success
      ) {

        setCameraStatus(
          '✓ Presensi berhasil',
          'success'
        );


        setResult(
          (
            data.message ||
            'Presensi berhasil.'
          ) +
          (
            data.timestamp
              ? ' • ' +
                data.timestamp
              : ''
          ),
          'success'
        );


        playSuccessSound();


        setTimeout(
          function() {

            resumeScanner();

          },
          1800
        );


        return;
      }


      if (
        data.duplicate
      ) {

        setCameraStatus(
          '⚠ QR sudah tercatat',
          'error'
        );


        setResult(
          data.message ||
          'Presensi sudah tercatat.',
          'error'
        );


        playErrorSound();


        setTimeout(
          function() {

            resumeScanner();

          },
          1800
        );


        return;
      }


      setCameraStatus(
        'Presensi gagal',
        'error'
      );


      setResult(
        data.message ||
        'Presensi gagal dicatat.',
        'error'
      );


      playErrorSound();


      setTimeout(
        function() {

          resumeScanner();

        },
        1800
      );

    }


    // ====================================================
    // PAUSE
    // ====================================================

    function pauseScanner() {

      scannerPaused =
        true;
    }


    // ====================================================
    // RESUME
    // ====================================================

    function resumeScanner() {

      if (
        !scannerRunning
      ) {
        return;
      }


      processingScan =
        false;


      scannerPaused =
        false;


      setCameraStatus(
        'Kamera aktif • Arahkan QR ke kotak hijau.',
        ''
      );


      setResult(
        'Menunggu QR peserta...',
        ''
      );

    }


    // ====================================================
    // STOP
    // ====================================================

    async function stopScanner() {

      try {

        if (
          html5QrCode &&
          scannerRunning
        ) {

          await html5QrCode.stop();

          scannerRunning =
            false;
        }

      } catch (error) {

        console.warn(
          'Stop scanner:',
          error
        );

      }


      btnCamera.disabled =
        false;


      btnCamera.textContent =
        '📷 Aktifkan Kamera';


      setCameraStatus(
        'Kamera dihentikan.',
        ''
      );

    }


    // ====================================================
    // CAMERA CHANGE
    // ====================================================

    cameraSelect.addEventListener(
      'change',
      async function() {

        const cameraId =
          cameraSelect.value;


        if (!cameraId) {
          return;
        }


        selectedCameraId =
          cameraId;


        if (
          scannerRunning
        ) {

          try {

            await html5QrCode.stop();

          } catch (e) {}


          scannerRunning =
            false;


          await startScanner(
            cameraId
          );

        }


        postToParent({

          type:
            'BA_CAMERA_CHANGED',

          cameraId:
            cameraId

        });

      }
    );


    // ====================================================
    // CLOSE
    // ====================================================

    function closeScanner() {

      postToParent({

        type:
          'BA_SCANNER_CLOSED'

      });


      stopScanner()
        .finally(
          function() {

            window.close();

          }
        );

    }


    // ====================================================
    // STATUS
    // ====================================================

    function setCameraStatus(
      message,
      type
    ) {

      cameraStatus.textContent =
        message;


      cameraStatus.className =
        'camera-status' +
        (
          type
            ? ' ' + type
            : ''
        );
    }


    function setResult(
      message,
      type
    ) {

      resultBox.textContent =
        message;


      resultBox.className =
        'result' +
        (
          type
            ? ' ' + type
            : ''
        );
    }


    // ====================================================
    // AUDIO
    // ====================================================

    function playTone(
      frequency,
      duration,
      type = 'sine'
    ) {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (!AudioContext) {
          return;
        }


        const ctx =
          new AudioContext();


        const oscillator =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        oscillator.type =
          type;


        oscillator.frequency.value =
          frequency;


        gain.gain.setValueAtTime(
          0.001,
          ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.18,
          ctx.currentTime + .02
        );


        gain.gain.exponentialRampToValueAtTime(
          .001,
          ctx.currentTime + duration
        );


        oscillator.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        oscillator.start();


        oscillator.stop(
          ctx.currentTime +
          duration
        );

      } catch (e) {}

    }


    function playSuccessSound() {

      playTone(
        880,
        .10
      );


      setTimeout(
        function() {

          playTone(
            1175,
            .14
          );

        },
        100
      );

    }


    function playErrorSound() {

      playTone(
        240,
        .20,
        'square'
      );

    }


  </script>
