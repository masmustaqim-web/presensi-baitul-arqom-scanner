<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Presensi Baitul Arqom Scanner</title>


  <!-- ==================================================
       QR SCANNER
       ================================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    /* ==================================================
       BASE
       ================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;

      height: 100%;

      margin: 0;

      padding: 0;

      overflow: hidden;

      background:
        #020b17;

      font-family:
        Poppins,
        Arial,
        sans-serif;
    }


    /* ==================================================
       CAMERA
       ================================================== */

    #reader {

      position: relative;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background:
        #020b17;
    }


    #reader > div {

      width:
        100% !important;

      height:
        100% !important;
    }


    /*
     * html5-qrcode dapat membuat elemen video
     * dengan struktur DOM yang berbeda antar versi.
     */

    #reader video {

      width:
        100% !important;

      height:
        100% !important;

      object-fit:
        cover !important;

      position:
        absolute !important;

      inset:
        0 !important;

      transform:
        none !important;

      -webkit-transform:
        none !important;
    }


    #reader canvas {

      display:
        none !important;
    }


    /* ==================================================
       SCANNER STATUS
       ================================================== */

    #scannerStatus {

      position:
        absolute;

      z-index:
        50;

      left:
        50%;

      bottom:
        12px;

      transform:
        translateX(-50%);

      width:
        max-content;

      max-width:
        calc(100% - 30px);

      padding:
        7px 13px;

      border-radius:
        999px;

      background:
        rgba(7,29,58,.80);

      border:
        1px solid
        rgba(255,255,255,.14);

      color:
        #d8e4f1;

      font-size:
        11px;

      line-height:
        1.4;

      text-align:
        center;

      pointer-events:
        none;

      transition:
        .2s ease;
    }


    #scannerStatus.success {

      background:
        rgba(11,143,91,.90);

      border-color:
        rgba(19,184,117,.80);

      color:
        white;
    }


    #scannerStatus.error {

      background:
        rgba(127,29,29,.92);

      border-color:
        rgba(239,68,68,.80);

      color:
        white;
    }


    #scannerStatus.warning {

      background:
        rgba(120,73,15,.92);

      border-color:
        rgba(245,158,11,.75);

      color:
        white;
    }


    /* ==================================================
       SUCCESS FLASH
       ================================================== */

    #resultFlash {

      position:
        absolute;

      z-index:
        40;

      inset:
        0;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        rgba(7,29,58,.60);

      backdrop-filter:
        blur(3px);

      opacity:
        0;

      pointer-events:
        none;

      transition:
        .2s ease;
    }


    #resultFlash.show {

      opacity:
        1;
    }


    .result-box {

      width:
        min(85%, 330px);

      padding:
        22px;

      border-radius:
        20px;

      background:
        rgba(7,29,58,.95);

      border:
        1px solid
        rgba(255,255,255,.12);

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.35);

      text-align:
        center;

      color:
        white;
    }


    .result-icon {

      font-size:
        42px;

      margin-bottom:
        8px;
    }


    .result-title {

      font-size:
        18px;

      font-weight:
        800;
    }


    .result-detail {

      margin-top:
        7px;

      color:
        #aabbd0;

      font-size:
        12px;

      line-height:
        1.6;

      white-space:
        pre-line;
    }

  </style>

</head>


<body>


  <div id="reader"></div>


  <div id="scannerStatus">
    Menghubungkan scanner...
  </div>


  <div id="resultFlash">

    <div class="result-box">

      <div
        class="result-icon"
        id="resultIcon">
        ✓
      </div>

      <div
        class="result-title"
        id="resultTitle">
        Presensi Berhasil
      </div>

      <div
        class="result-detail"
        id="resultDetail">
      </div>

    </div>

  </div>


  <script>

    // ====================================================
    // URL PARAMETERS
    // ====================================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const SESSION_CODE =
      params.get('sesi') || '';


    const NONCE =
      params.get('nonce') || '';


    const TARGET_ORIGIN =
      params.get('targetOrigin') || '';


    // ====================================================
    // ELEMENT
    // ====================================================

    const reader =
      document.getElementById(
        'reader'
      );


    const scannerStatus =
      document.getElementById(
        'scannerStatus'
      );


    const resultFlash =
      document.getElementById(
        'resultFlash'
      );


    const resultIcon =
      document.getElementById(
        'resultIcon'
      );


    const resultTitle =
      document.getElementById(
        'resultTitle'
      );


    const resultDetail =
      document.getElementById(
        'resultDetail'
      );


    // ====================================================
    // STATE
    // ====================================================

    let html5QrCode =
      null;


    let scannerRunning =
      false;


    let processingScan =
      false;


    let currentCameraId =
      null;


    let currentSession =
      SESSION_CODE;


    let availableDevices =
      [];


    // ====================================================
    // SEND TO PARENT
    // ====================================================

    function sendToParent(
      type,
      payload
    ) {

      if (
        !TARGET_ORIGIN
      ) {

        return;
      }


      window.parent.postMessage(

        Object.assign(

          {
            type:
              type,

            nonce:
              NONCE
          },

          payload || {}

        ),

        TARGET_ORIGIN
      );
    }


    // ====================================================
    // VALIDATE PARENT MESSAGE
    // ====================================================

    function isValidParentMessage(
      event
    ) {

      if (
        event.source !==
        window.parent
      ) {

        return false;
      }


      if (
        !TARGET_ORIGIN ||
        event.origin !==
        TARGET_ORIGIN
      ) {

        return false;
      }


      const data =
        event.data || {};


      if (
        data.nonce !==
        NONCE
      ) {

        return false;
      }


      return true;
    }


    // ====================================================
    // STATUS
    // ====================================================

    function setStatus(
      message,
      type
    ) {

      scannerStatus.textContent =
        message || '';


      scannerStatus.className =
        type || '';
    }


    // ====================================================
    // CAMERA LIST
    // ====================================================

    async function requestCameras() {

      try {

        setStatus(
          'Meminta izin kamera...'
        );


        const devices =
          await Html5Qrcode.getCameras();


        availableDevices =
          devices || [];


        if (
          availableDevices.length === 0
        ) {

          throw new Error(
            'Tidak ada kamera yang ditemukan.'
          );
        }


        const formatted =
          availableDevices.map(
            function(device, index) {

              return {

                id:
                  device.id,

                label:
                  device.label ||
                  'Kamera ' +
                  (index + 1)
              };
            }
          );


        const defaultCamera =
          findDefaultCamera(
            availableDevices
          );


        currentCameraId =
          defaultCamera
            ? defaultCamera.id
            : availableDevices[0].id;


        sendToParent(
          'BA_CAMERA_LIST',
          {

            devices:
              formatted,

            defaultCameraId:
              currentCameraId
          }
        );


        setStatus(
          'Kamera siap.'
        );


      } catch (error) {

        reportCameraError(
          error
        );
      }
    }


    // ====================================================
    // FIND DEFAULT BACK CAMERA
    // ====================================================

    function findDefaultCamera(
      devices
    ) {

      const keywords = [

        'back',
        'rear',
        'environment',
        'belakang',
        'utama'
      ];


      const found =
        devices.find(
          function(device) {

            const label =
              String(
                device.label || ''
              ).toLowerCase();


            return keywords.some(
              function(keyword) {

                return label.includes(
                  keyword
                );
              }
            );
          }
        );


      return found ||
        devices[0];
    }


    // ====================================================
    // START CAMERA
    // ====================================================

    async function startScanner(
      cameraId
    ) {

      try {

        if (
          scannerRunning
        ) {

          await stopScanner(
            false
          );
        }


        if (!cameraId) {

          if (
            availableDevices.length === 0
          ) {

            await requestCameras();
          }


          cameraId =
            currentCameraId;
        }


        if (!cameraId) {

          throw new Error(
            'Kamera belum dipilih.'
          );
        }


        currentCameraId =
          cameraId;


        processingScan =
          false;


        html5QrCode =
          new Html5Qrcode(
            'reader'
          );


        setStatus(
          'Mengaktifkan kamera...'
        );


        await html5QrCode.start(

          cameraId,

          {

            fps:
              10,

            disableFlip:
              true

          },

          onScanSuccess,

          onScanFailure

        );


        scannerRunning =
          true;


        applyVideoStyle();


        setStatus(
          'Scanner aktif'
        );


        sendToParent(
          'BA_SCANNER_STATUS',
          {
            message:
              'Scanner aktif'
          }
        );


      } catch (error) {

        scannerRunning =
          false;


        reportCameraError(
          error
        );
      }
    }


    // ====================================================
    // STOP CAMERA
    // ====================================================

    async function stopScanner(
      notifyParent = true
    ) {

      scannerRunning =
        false;


      processingScan =
        false;


      if (
        html5QrCode
      ) {

        try {

          await html5QrCode.stop();

        } catch (error) {

          console.log(
            'Stop:',
            error
          );
        }


        try {

          await html5QrCode.clear();

        } catch (error) {}
      }


      html5QrCode =
        null;


      setStatus(
        'Scanner berhenti'
      );


      if (
        notifyParent
      ) {

        sendToParent(
          'BA_SCANNER_STATUS',
          {
            message:
              'Scanner berhenti'
          }
        );
      }
    }


    // ====================================================
    // SWITCH CAMERA
    // ====================================================

    async function switchCamera(
      cameraId
    ) {

      if (!cameraId) {
        return;
      }


      currentCameraId =
        cameraId;


      setStatus(
        'Mengganti kamera...'
      );


      await startScanner(
        cameraId
      );
    }


    // ====================================================
    // VIDEO STYLE
    // ====================================================

    function applyVideoStyle() {

      setTimeout(
        function() {

          const video =
            reader.querySelector(
              'video'
            );


          if (!video) {
            return;
          }


          video.style.width =
            '100%';


          video.style.height =
            '100%';


          video.style.objectFit =
            'cover';


          video.style.transform =
            'none';


          video.style.webkitTransform =
            'none';


        },
        400
      );
    }


    // ====================================================
    // QR SUCCESS
    // ====================================================

    function onScanSuccess(
      decodedText
    ) {

      if (
        processingScan
      ) {

        return;
      }


      const nomorId =
        String(
          decodedText || ''
        ).trim();


      if (!nomorId) {
        return;
      }


      processingScan =
        true;


      try {

        if (
          html5QrCode &&
          scannerRunning
        ) {

          /*
           * Pause sementara.
           *
           * Kamera TIDAK dimatikan.
           */

          html5QrCode.pause(
            true
          );
        }

      } catch (error) {}


      setStatus(
        'QR terbaca — memproses...'
      );


      sendToParent(
        'BA_QR_SCANNED',
        {

          nomorId:
            nomorId,

          kodeSesi:
            currentSession
        }
      );
    }


    // ====================================================
    // QR FAILURE
    // ====================================================

    function onScanFailure(
      error
    ) {

      /*
       * Tidak melakukan apa-apa.
       *
       * Callback ini memang dipanggil berkali-kali
       * saat tidak menemukan QR.
       */
    }


    // ====================================================
    // RESULT DARI SERVER
    // ====================================================

    async function handleAttendanceResult(
      data
    ) {

      processingScan =
        false;


      const success =
        !!data.success;


      const duplicate =
        !!data.duplicate;


      if (success) {

        showResult(

          '✓',

          'Presensi Berhasil',

          data.message ||
          'Presensi berhasil disimpan.',

          'success'
        );


        playSuccessSound();


      } else if (duplicate) {

        showResult(

          '⚠',

          'Sudah Absen',

          data.message ||
          'Peserta sudah melakukan presensi.',

          'warning'
        );


        playErrorSound();


      } else {

        showResult(

          '✕',

          'Presensi Gagal',

          data.message ||
          'Presensi tidak dapat disimpan.',

          'error'
        );


        playErrorSound();
      }


      /*
       * Jangan mematikan kamera.
       *
       * Tunggu sebentar agar operator bisa
       * membaca hasilnya.
       */

      setTimeout(
        function() {

          resultFlash.classList.remove(
            'show'
          );


          if (
            html5QrCode &&
            scannerRunning
          ) {

            try {

              html5QrCode.resume();


              setStatus(
                'Scanner aktif'
              );

            } catch (error) {

              console.log(
                'Resume:',
                error
              );
            }
          }

        },

        success
          ? 1500
          : 2200
      );
    }


    // ====================================================
    // RESULT DISPLAY
    // ====================================================

    function showResult(
      icon,
      title,
      detail,
      type
    ) {

      resultIcon.textContent =
        icon;


      resultTitle.textContent =
        title;


      resultDetail.textContent =
        detail;


      resultFlash.className =
        'show';


      resultFlash.classList.add(
        type
      );


      setStatus(
        title,
        type
      );
    }


    // ====================================================
    // CAMERA ERROR
    // ====================================================

    function reportCameraError(
      error
    ) {

      const message =
        getCameraErrorMessage(
          error
        );


      setStatus(
        message,
        'error'
      );


      sendToParent(
        'BA_SCANNER_ERROR',
        {
          message:
            message
        }
      );
    }


    function getCameraErrorMessage(
      error
    ) {

      const text =
        String(
          error &&
          error.message
            ? error.message
            : error || ''
        );


      const lower =
        text.toLowerCase();


      if (
        lower.includes(
          'notallowed'
        ) ||
        lower.includes(
          'permission'
        )
      ) {

        return (
          'Izin kamera ditolak. ' +
          'Izinkan akses kamera untuk situs ini.'
        );
      }


      if (
        lower.includes(
          'notfound'
        ) ||
        lower.includes(
          'no camera'
        )
      ) {

        return (
          'Kamera tidak ditemukan.'
        );
      }


      if (
        lower.includes(
          'notreadable'
        )
      ) {

        return (
          'Kamera sedang digunakan aplikasi lain.'
        );
      }


      return (
        'Kamera gagal digunakan: ' +
        text
      );
    }


    // ====================================================
    // MESSAGE FROM APPS SCRIPT
    // ====================================================

    window.addEventListener(
      'message',
      async function(event) {

        if (
          !isValidParentMessage(
            event
          )
        ) {

          return;
        }


        const data =
          event.data || {};


        // ----------------------------------------------
        // SET SESSION
        // ----------------------------------------------

        if (
          data.type ===
          'BA_SET_SESSION'
        ) {

          currentSession =
            String(
              data.kodeSesi ||
              SESSION_CODE ||
              ''
            );


          setStatus(
            currentSession
              ? 'Sesi: ' +
                currentSession
              : 'Scanner siap.'
          );


          return;
        }


        // ----------------------------------------------
        // REQUEST CAMERA
        // ----------------------------------------------

        if (
          data.type ===
          'BA_REQUEST_CAMERAS'
        ) {

          await requestCameras();

          return;
        }


        // ----------------------------------------------
        // START
        // ----------------------------------------------

        if (
          data.type ===
          'BA_START_SCANNER'
        ) {

          await startScanner(
            data.cameraId ||
            currentCameraId
          );

          return;
        }


        // ----------------------------------------------
        // SWITCH
        // ----------------------------------------------

        if (
          data.type ===
          'BA_SWITCH_CAMERA'
        ) {

          await switchCamera(
            data.cameraId
          );

          return;
        }


        // ----------------------------------------------
        // STOP
        // ----------------------------------------------

        if (
          data.type ===
          'BA_STOP_SCANNER'
        ) {

          await stopScanner();

          return;
        }


        // ----------------------------------------------
        // PAUSE
        // ----------------------------------------------

        if (
          data.type ===
          'BA_PAUSE_SCANNER'
        ) {

          try {

            if (
              html5QrCode &&
              scannerRunning
            ) {

              html5QrCode.pause(
                true
              );
            }

          } catch (error) {}

          return;
        }


        // ----------------------------------------------
        // RESUME
        // ----------------------------------------------

        if (
          data.type ===
          'BA_RESUME_SCANNER'
        ) {

          try {

            if (
              html5QrCode &&
              scannerRunning
            ) {

              html5QrCode.resume();
            }

          } catch (error) {}

          return;
        }


        // ----------------------------------------------
        // ATTENDANCE RESULT
        // ----------------------------------------------

        if (
          data.type ===
          'BA_ATTENDANCE_RESULT'
        ) {

          await handleAttendanceResult(
            data
          );

          return;
        }

      }
    );


    // ====================================================
    // AUDIO
    // ====================================================

    function playSuccessSound() {

      playTone([
        {
          f: 660,
          d: 100
        },

        {
          f: 880,
          d: 160
        }
      ]);
    }


    function playErrorSound() {

      playTone([
        {
          f: 240,
          d: 170
        },

        {
          f: 180,
          d: 220
        }
      ]);
    }


    function playTone(
      sequence
    ) {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (!AudioContext) {
          return;
        }


        const ctx =
          new AudioContext();


        let offset = 0;


        sequence.forEach(
          function(item) {

            const oscillator =
              ctx.createOscillator();


            const gain =
              ctx.createGain();


            oscillator.type =
              'sine';


            oscillator.frequency.value =
              item.f;


            gain.gain.setValueAtTime(
              0.0001,
              ctx.currentTime +
              offset
            );


            gain.gain.exponentialRampToValueAtTime(
              0.15,
              ctx.currentTime +
              offset +
              0.015
            );


            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              ctx.currentTime +
              offset +
              item.d / 1000
            );


            oscillator.connect(
              gain
            );


            gain.connect(
              ctx.destination
            );


            oscillator.start(
              ctx.currentTime +
              offset
            );


            oscillator.stop(
              ctx.currentTime +
              offset +
              item.d / 1000 +
              0.03
            );


            offset +=
              item.d / 1000 +
              0.04;
          }
        );


        setTimeout(
          function() {

            try {
              ctx.close();
            } catch (e) {}

          },
          (offset + 0.5) * 1000
        );

      } catch (error) {}
    }


    // ====================================================
    // READY
    // ====================================================

    window.addEventListener(
      'load',
      function() {

        /*
         * Beritahu Apps Script:
         *
         * "Saya sudah hidup dan siap menerima perintah."
         */

        sendToParent(
          'BA_SCANNER_READY',
          {
            session:
              SESSION_CODE
          }
        );

      }
    );


    // ====================================================
    // CLEANUP
    // ====================================================

    window.addEventListener(
      'beforeunload',
      function() {

        try {

          stopScanner(
            false
          );

        } catch (error) {}

      }
    );

  </script>

</body>

</html>
